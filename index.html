<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Calculator</title>
  <meta name="description" content="An iPhone-style calculator, installable as a Progressive Web App." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />

  <!-- PWA manifest (relative path: works on GitHub Pages subpaths) -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#000000" />

  <!-- iOS Safari "Add to Home Screen" support (manifest.json alone is
       not fully honored by iOS Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <button
        id="hamburger-btn"
        class="icon-button"
        type="button"
        aria-label="Open calculation history"
        aria-haspopup="true"
        aria-controls="history-panel"
      >
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div class="topbar-actions">
        <button id="install-btn" class="install-button" type="button" hidden>Install</button>
        <button id="version-badge" class="version-badge" type="button" title="Tap to check for updates">v6.4</button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <div id="upper-display" class="display-line display-upper" aria-label="Expression"></div>
      <div id="lower-display" class="display-line display-lower" aria-label="Current value">0</div>
    </section>

    <div id="copy-toast" class="copy-toast" aria-live="polite" aria-atomic="true">Copied</div>

    <section id="keypad" class="keypad" role="group" aria-label="Calculator keypad">
      <!-- Row 1: extended function row -->
      <button type="button" class="btn btn-function" data-action="paren-open" aria-label="Open parenthesis">(</button>
      <button type="button" class="btn btn-function" data-action="paren-close" aria-label="Close parenthesis" aria-disabled="true" disabled>)</button>
      <button type="button" class="btn btn-function" data-action="reciprocal" aria-label="Reciprocal, one over x">1/x</button>
      <button type="button" class="btn btn-function" data-action="power" aria-label="X to the power of Y">x<sup>y</sup></button>

      <!-- Row 2 -->
      <button type="button" class="btn btn-function" data-action="clear" aria-label="All clear">AC</button>
      <button type="button" class="btn btn-function" data-action="backspace" aria-label="Backspace">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M9 6h11a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-6-6 6-6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <path d="M13 10l4 4m0-4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" class="btn btn-function" data-action="sign" aria-label="Toggle positive or negative">+/&minus;</button>
      <button type="button" class="btn btn-operator" data-action="op-divide" aria-label="Divide">&divide;</button>

      <!-- Row 3 -->
      <button type="button" class="btn btn-number" data-action="digit" data-value="7">7</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="8">8</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="9">9</button>
      <button type="button" class="btn btn-operator" data-action="op-multiply" aria-label="Multiply">&times;</button>

      <!-- Row 4 -->
      <button type="button" class="btn btn-number" data-action="digit" data-value="4">4</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="5">5</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="6">6</button>
      <button type="button" class="btn btn-operator" data-action="op-subtract" aria-label="Subtract">&minus;</button>

      <!-- Row 5 -->
      <button type="button" class="btn btn-number" data-action="digit" data-value="1">1</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="2">2</button>
      <button type="button" class="btn btn-number" data-action="digit" data-value="3">3</button>
      <button type="button" class="btn btn-operator" data-action="op-add" aria-label="Add">+</button>

      <!-- Row 6 -->
      <button type="button" class="btn btn-number btn-wide" data-action="digit" data-value="0">0</button>
      <button type="button" class="btn btn-number" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" class="btn btn-operator" data-action="equals" aria-label="Equals">=</button>
    </section>

  </div>

  <!-- History side panel -->
  <div id="history-overlay" class="history-overlay" aria-hidden="true"></div>
  <aside id="history-panel" class="history-panel" aria-hidden="true" aria-label="Calculation history">
    <div class="history-header">
      <h2>History</h2>
      <button class="history-close icon-button" type="button" aria-label="Close history">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <ul id="history-list" class="history-list"></ul>
    <div class="history-footer">
      <button id="clear-history-btn" class="text-button" type="button">Clear History</button>
    </div>
  </aside>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <p>Clear all calculation history? This can't be undone.</p>
    <div class="confirm-actions">
      <button id="confirm-no" class="confirm-btn confirm-btn-cancel" type="button">Cancel</button>
      <button id="confirm-yes" class="confirm-btn confirm-btn-clear" type="button">Clear</button>
    </div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
